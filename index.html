
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b16">
<title>StoryFrame AI Storyboard Studio</title>
<style>
:root{color-scheme:dark;--bg:#090914;--panel:#151526;--line:#292944;--text:#f4f2ff;--muted:#aaa8c2;--accent:#9b83ff;--cyan:#51e0d0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#24204b 0,#090914 48%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
header{padding:24px 18px;text-align:center}
.logo{font-size:13px;letter-spacing:4px;color:var(--cyan);font-weight:bold}
h1{font-size:clamp(27px,7vw,43px);margin:12px 0 8px}
header p,.muted{color:var(--muted);line-height:1.6}
main{width:min(900px,92%);margin:auto;padding-bottom:55px}
.panel,.scene{background:rgba(21,21,38,.94);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:17px}
label{display:block;font-size:14px;font-weight:bold;margin:16px 0 9px}
textarea,select{width:100%;background:#0c0c19;color:white;border:1px solid #393956;border-radius:11px;padding:13px;font:inherit}
textarea{min-height:135px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button{border:0;border-radius:11px;padding:13px 17px;font-weight:bold;font-size:14px;cursor:pointer}
.primary{width:100%;margin-top:19px;background:linear-gradient(100deg,#8d70ff,#51d9d0);color:#090914}
.secondary{background:#292944;color:white;border:1px solid #454568}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1}
button:disabled{opacity:.55;cursor:wait}
#notice{font-size:13px;margin:14px 0 0;text-align:center}
.scene h3{margin-top:0;color:var(--cyan)}
.scene h4{font-size:12px;color:#b9aaff;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.scene p{line-height:1.6;white-space:pre-wrap;margin-top:5px}
#results{display:none}
#storyTitle{margin-bottom:5px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.panel,.scene{padding:16px}header{padding-top:32px}}
</style>
</head>
<body>
<header>
<div class="logo">STORYFRAME STUDIO</div>
<h1>AI Cinematic Storyboard</h1>
<p id="subtitle">Ubah ide sederhana menjadi cerita sinematik.</p>
</header>

<main>
<section class="panel">
<div class="actions">
<button class="secondary" id="idBtn" type="button" onclick="setLanguage('id')">Bahasa Indonesia</button>
<button class="secondary" id="enBtn" type="button" onclick="setLanguage('en')">English</button>
</div>

<label id="ideaLabel" for="idea">Ide cerita</label>
<textarea id="idea" maxlength="3000" placeholder="Ceritakan ide film yang ingin kamu buat..."></textarea>

<div class="grid">
<div>
<label id="genreLabel" for="genre">Genre</label>
<select id="genre">
<option>Adventure</option><option>Fantasy</option><option>Action</option>
<option>Horror</option><option>Drama</option><option>Sci-Fi</option>
<option>Documentary</option>
</select>
</div>
<div>
<label id="styleLabel" for="style">Gaya cinematic</label>
<select id="style">
<option>Epic Cinematic</option><option>Dark Cinematic</option>
<option>Emotional</option><option>Realistic</option><option>Anime</option>
</select>
</div>
<div>
<label id="countLabel" for="count">Jumlah adegan</label>
<select id="count">
<option value="5">5 Scenes</option>
<option value="7">7 Scenes</option>
<option value="10">10 Scenes</option>
<option value="15">15 Scenes</option>
</select>
</div>
</div>

<button class="primary" id="generateBtn" type="button" onclick="generate()">✦ Generate Storyboard</button>
<p id="notice" class="muted">AI siap menerima ide ceritamu.</p>
</section>

<section id="results">
<div class="panel">
<h2 id="storyTitle">Storyboard</h2>
<p id="logline" class="muted"></p>
<div class="actions">
<button class="secondary" onclick="copyStoryboard()">Copy Storyboard</button>
<button class="secondary" onclick="exportStoryboard()">Export TXT</button>
</div>
</div>
<div id="sceneList"></div>
</section>
</main>

<footer>StoryFrame AI Storyboard Studio</footer>

<script>
const API_URL = "https://storyframe-private-studio.ahmadmamennn.workers.dev/api/generate";

let language = "id";
let currentStoryboard = null;

const translations = {
id:{
subtitle:"Ubah ide sederhana menjadi cerita sinematik.",
idea:"Ide cerita",placeholder:"Ceritakan ide film yang ingin kamu buat...",
genre:"Genre",style:"Gaya cinematic",count:"Jumlah adegan",
generate:"✦ Generate Storyboard",loading:"Sedang membuat storyboard...",
ready:"AI siap menerima ide ceritamu.",empty:"Masukkan ide cerita terlebih dahulu.",
failed:"Gagal membuat storyboard: ",title:"Storyboard",
visual:"Deskripsi visual",camera:"Arahan kamera",narration:"Narasi / dialog",
sound:"Musik dan suara",copy:"Storyboard berhasil disalin!",
copied:"Storyboard berhasil disalin!",exported:"Storyboard berhasil diekspor."
},
en:{
subtitle:"Turn simple ideas into cinematic stories.",
idea:"Story idea",placeholder:"Describe the film you want to create...",
genre:"Genre",style:"Cinematic style",count:"Number of scenes",
generate:"✦ Generate Storyboard",loading:"Creating your storyboard...",
ready:"AI is ready for your story idea.",empty:"Please enter a story idea first.",
failed:"Failed to generate storyboard: ",title:"Storyboard",
visual:"Visual description",camera:"Camera direction",narration:"Narration / dialogue",
sound:"Music and sound",copy:"Storyboard copied!",
copied:"Storyboard copied!",exported:"Storyboard exported."
}
};

function setLanguage(lang){
language=lang;
const t=translations[lang];
document.documentElement.lang=lang;
document.getElementById("subtitle").textContent=t.subtitle;
document.getElementById("ideaLabel").textContent=t.idea;
document.getElementById("idea").placeholder=t.placeholder;
document.getElementById("genreLabel").textContent=t.genre;
document.getElementById("styleLabel").textContent=t.style;
document.getElementById("countLabel").textContent=t.count;
document.getElementById("generateBtn").textContent=t.generate;
document.getElementById("notice").textContent=t.ready;
document.getElementById("idBtn").style.borderColor=lang==="id"?"#9b83ff":"#454568";
document.getElementById("enBtn").style.borderColor=lang==="en"?"#9b83ff":"#454568";
}

async function generate(){
const t=translations[language];
const idea=document.getElementById("idea").value.trim();
const button=document.getElementById("generateBtn");
const notice=document.getElementById("notice");

if(!idea){notice.textContent=t.empty;return;}

button.disabled=true;
button.textContent=t.loading;
notice.textContent=t.loading;

try{
const response=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
idea,
scenes:Number(document.getElementById("count").value),
style:document.getElementById("style").value,
genre:document.getElementById("genre").value,
language
})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error||"Server error "+response.status);
}

if(!Array.isArray(data.scenes)||data.scenes.length===0){
throw new Error("AI tidak mengirim adegan storyboard.");
}

currentStoryboard=data;
displayStoryboard(data);
notice.textContent="✓ "+(language==="id"?"Storyboard berhasil dibuat.":"Storyboard generated successfully.");

}catch(error){
notice.textContent=t.failed+error.message;
}finally{
button.disabled=false;
button.textContent=t.generate;
}
}

function displayStoryboard(data){
const t=translations[language];
document.getElementById("results").style.display="block";
document.getElementById("storyTitle").textContent=data.title||t.title;
document.getElementById("logline").textContent=data.logline||"";
const list=document.getElementById("sceneList");
list.innerHTML="";

data.scenes.forEach((scene,index)=>{
const card=document.createElement("article");
card.className="scene";

const heading=document.createElement("h3");
heading.textContent="SCENE "+(index+1)+" — "+(scene.title||"");
card.appendChild(heading);

addField(card,t.visual,scene.visualPrompt||scene.visual);
addField(card,t.camera,scene.cameraDirection||scene.camera);
addField(card,t.narration,scene.narration);
addField(card,t.sound,scene.sound);

list.appendChild(card);
});

document.getElementById("results").scrollIntoView({behavior:"smooth"});
}

function addField(card,label,value){
const heading=document.createElement("h4");
heading.textContent=label;
const paragraph=document.createElement("p");
paragraph.textContent=value||"-";
card.appendChild(heading);
card.appendChild(paragraph);
}

function storyboardText(){
if(!currentStoryboard)return "";
let output=(currentStoryboard.title||"Storyboard")+"\n";
output+=(currentStoryboard.logline||"")+"\n\n";
currentStoryboard.scenes.forEach((s,i)=>{
output+="SCENE "+(i+1)+" — "+(s.title||"")+"\n";
output+="Visual: "+(s.visualPrompt||s.visual||"")+"\n";
output+="Camera: "+(s.cameraDirection||s.camera||"")+"\n";
output+="Narration: "+(s.narration||"")+"\n";
output+="Sound: "+(s.sound||"")+"\n\n";
});
return output;
}

async function copyStoryboard(){
if(!currentStoryboard)return;
try{
await navigator.clipboard.writeText(storyboardText());
document.getElementById("notice").textContent=translations[language].copied;
}catch{
document.getElementById("notice").textContent="Clipboard tidak tersedia di browser ini.";
}
}

function exportStoryboard(){
if(!currentStoryboard)return;
const blob=new Blob([storyboardText()],{type:"text/plain;charset=utf-8"});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");
link.href=url;
link.download="storyframe-storyboard.txt";
link.click();
URL.revokeObjectURL(url);
document.getElementById("notice").textContent=translations[language].exported;
}

setLanguage("id");
</script>
</body>
</html>
